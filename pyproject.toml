[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepverify"
version = "0.1.0"
description = "Academic document intelligence and visual anomaly detection prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "results", "venv", "paddle_venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
